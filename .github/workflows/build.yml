# Compila il plugin su GitHub: non serve installare nulla sul tuo computer.
# Dopo ogni "commit" (o da Actions > Build > Run workflow) il file freecam.3gx
# si scarica dalla sezione "Artifacts" della corsa.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Get the source code
        uses: actions/checkout@v5

      - name: Install 3gxtool
        run: sh tools/install_tools.sh

      - name: Build
        run: |
          # The Makefile calls 3gxtool without its path.
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          make -j"$(nproc)"

      - name: Keep the plugin file
        uses: actions/upload-artifact@v7
        with:
          name: freecam-plugin
          path: freecam.3gx
          if-no-files-found: error
